<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/fehler.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travona · Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EFE8">
<link href="/fonts/fonts.css" rel="stylesheet">
<script src="/vendor/supabase-js-2.117.2.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--paper:#F4EFE8;--ink:#1A1714;--fog:#6B6560;--line:#D8D0C4;--white:#fff;--terra:#B5714A;--teal:#2C5F6A;--ok:#5f7a4f;--bad:#b3412e;}
body{background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;}
header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.hi{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;}
.logo{font-family:'Playfair Display',serif;font-weight:600;font-size:1.15rem;color:var(--ink);text-decoration:none;}
.logo em{color:var(--terra);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;font:500 .82rem 'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fog);text-decoration:none;}
.btn:hover{color:var(--ink);border-color:var(--ink);}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px;}
h1{font-family:'Playfair Display',serif;font-weight:400;font-size:1.8rem;margin-bottom:4px;}
.sub{color:var(--fog);font-size:.85rem;margin-bottom:22px;}
h2{font-family:'Playfair Display',serif;font-weight:400;font-size:1.25rem;margin:30px 0 12px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.tile{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.tile .l{font-size:.75rem;color:var(--fog);text-transform:uppercase;letter-spacing:.04em;}
.tile .v{font-family:'Playfair Display',serif;font-size:1.9rem;margin-top:4px;font-variant-numeric:tabular-nums;}
.tile .h{font-size:.78rem;color:var(--fog);margin-top:2px;}
.tile.warn .v{color:var(--bad);}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;overflow-x:auto;}
.card .ct{font-size:.85rem;color:var(--fog);margin-bottom:10px;}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:6px;}
.chart .b span{display:block;background:var(--terra);border-radius:3px 3px 0 0;min-height:1px;}
.chart .b span.d{background:var(--teal);border-radius:0;}
.chart .b:hover span{opacity:.75;}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--fog);margin-top:6px;}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--fog);margin-bottom:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
table{width:100%;border-collapse:collapse;font-size:.84rem;}
th{text-align:left;font-weight:500;color:var(--fog);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);}
td{padding:7px 8px;border-bottom:1px solid #eee7dd;vertical-align:top;}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
td.m{max-width:420px;word-break:break-word;}
.muted{color:var(--fog);}
.msg{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:28px;text-align:center;max-width:460px;margin:60px auto;}
.msg p{color:var(--fog);margin:10px 0 18px;}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:.75rem;padding:4px 8px;border-radius:6px;display:none;z-index:20;}
@media (max-width:600px){h1{font-size:1.5rem}.tile .v{font-size:1.6rem}}
</style>
</head>
<body>
<header><div class="hi">
  <a class="logo" href="/">trav<em>ona</em> · Admin</a>
  <div><button class="btn" id="reload" onclick="laden()" hidden>Aktualisieren</button>
  <a class="btn" href="/meine-reisen.html">Meine Reisen</a></div>
</div></header>
<main id="app"><div class="msg"><p>Lädt …</p></div></main>
<div id="tip"></div>

<script>
var SUPA_URL='https://celihvrblqqivtlvzbjp.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlbGlodnJibHFxaXZ0bHZ6YmpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDg4NzcsImV4cCI6MjA5ODIyNDg3N30.HkoN6h7tRtqOWdhidh4Gk7hrHmpNtW9rRteuVo3eFT4';
var sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
var app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function zahl(n){return Number(n||0).toLocaleString('de-DE');}
function datum(s,mitZeit){if(!s)return '–';var d=new Date(s);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})+(mitZeit?' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'');}
function tagKurz(s){var d=new Date(s+'T00:00:00');return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function mb(b){b=Number(b||0);return b>1e9?(b/1e9).toLocaleString('de-DE',{maximumFractionDigits:2})+' GB':Math.round(b/1e6).toLocaleString('de-DE')+' MB';}

function meldung(titel,text,link){
  app.innerHTML='<div class="msg"><h1>'+esc(titel)+'</h1><p>'+esc(text)+'</p>'+(link||'')+'</div>';
}
function kachel(l,v,h,warn){return '<div class="tile'+(warn?' warn':'')+'"><div class="l">'+esc(l)+'</div><div class="v">'+v+'</div>'+(h?'<div class="h">'+h+'</div>':'')+'</div>';}

// Säulendiagramm; reihen = [{key, cls, name}], gestapelt
function diagramm(daten,reihen){
  var max=1;daten.forEach(function(d){var s=0;reihen.forEach(function(r){s+=Number(d[r.key]||0);});if(s>max)max=s;});
  var h='';
  if(reihen.length>1)h+='<div class="legend">'+reihen.map(function(r){return '<span><i style="background:var('+(r.cls==='d'?'--teal':'--terra')+')"></i>'+esc(r.name)+'</span>';}).join('')+'</div>';
  h+='<div class="chart">'+daten.map(function(d){
    var tip=tagKurz(d.tag)+': '+reihen.map(function(r){return (reihen.length>1?r.name+' ':'')+zahl(d[r.key]);}).join(', ');
    return '<div class="b" data-tip="'+esc(tip)+'">'+reihen.slice().reverse().map(function(r){
      var v=Number(d[r.key]||0);return v?'<span class="'+(r.cls||'')+'" style="height:'+(v/max*100)+'%"></span>':'';
    }).join('')+'</div>';
  }).join('')+'</div>';
  if(daten.length)h+='<div class="axis"><span>'+tagKurz(daten[0].tag)+'</span><span>höchster Wert: '+zahl(max)+'</span><span>'+tagKurz(daten[daten.length-1].tag)+'</span></div>';
  return h;
}

function zeigen(d){
  var n=d.nutzer,r=d.reisen,b=d.besuche,g=d.gaeste,k=d.ki,s=d.speicher,f=d.fehler;
  var h='<h1>Übersicht</h1><div class="sub">Stand '+datum(d.stand,true)+' · nur für dein Konto sichtbar</div>';

  h+='<h2>Nutzer &amp; Reisen</h2><div class="tiles">'
    +kachel('Nutzer gesamt',zahl(n.gesamt),'+'+zahl(n.neu_7)+' in 7 Tagen, +'+zahl(n.neu_30)+' in 30')
    +kachel('Aktiv (7 Tage)',zahl(n.aktiv_7),'zuletzt angemeldet')
    +kachel('E-Mail bestätigt',zahl(n.bestaetigt),'von '+zahl(n.gesamt))
    +kachel('Reisen',zahl(r.gesamt),zahl(r.oeffentlich)+' öffentlich · '+zahl(r.link)+' per Link · '+zahl(r.privat)+' privat')
    +kachel('Neue Reisen',zahl(r.neu_7),'in 7 Tagen')
    +'</div>';

  h+='<h2>Traffic</h2><div class="tiles">'
    +kachel('Besuche heute',zahl(b.heute))
    +kachel('Besuche 7 Tage',zahl(b.tage_7))
    +kachel('Besuche 30 Tage',zahl(b.tage_30),'gesamt '+zahl(b.gesamt))
    +kachel('Gästebuch',zahl(g.gaestebuch),'+'+zahl(g.gaestebuch_7)+' in 7 Tagen')
    +kachel('Emoji-Reaktionen',zahl(g.reaktionen),'+'+zahl(g.reaktionen_7)+' in 7 Tagen')
    +'</div>';
  h+='<div class="card"><div class="ct">Besuche geteilter Reisen pro Tag (30 Tage). Ein Gerät zählt einmal pro Reise und Tag, du selbst nicht.</div>'+diagramm(b.pro_tag,[{key:'anzahl',name:'Besuche'}])+'</div>';
  h+='<div class="card"><div class="ct">Meistbesuchte Reisen (gesamt)</div><table><tr><th>Reise</th><th>Sichtbarkeit</th><th class="n">Besuche</th></tr>'
    +(b.top_reisen.length?b.top_reisen.map(function(t){return '<tr><td>'+esc(t.titel)+'</td><td class="muted">'+esc({public:'öffentlich',link:'per Link',private:'privat'}[t.visibility]||'gelöscht')+'</td><td class="n">'+zahl(t.anzahl)+'</td></tr>';}).join(''):'<tr><td colspan="3" class="muted">Noch keine Besuche</td></tr>')
    +'</table></div>';

  h+='<h2>KI &amp; Speicher</h2><div class="tiles">'
    +kachel('KI-Aufrufe heute',zahl(k.heute),'angemeldete Nutzer')
    +kachel('KI-Aufrufe 30 Tage',zahl(k.tage_30))
    +kachel('Testen ohne Konto',zahl(k.demo_30),'Aufrufe in 30 Tagen · '+zahl(k.demo_besucher_30)+' Besucher')
    +kachel('Fotospeicher',mb(s.bytes),zahl(s.dateien)+' Dateien · Pro-Plan: 100 GB inklusive')
    +'</div>';
  h+='<div class="card"><div class="ct">KI-Aufrufe pro Tag (30 Tage)</div>'+diagramm(k.pro_tag,[{key:'konto',name:'mit Konto'},{key:'demo',cls:'d',name:'Testen ohne Konto'}])+'</div>';

  h+='<h2>Fehler</h2><div class="tiles">'
    +kachel('Fehler heute',zahl(f.heute),'',f.heute>0)
    +kachel('Fehler 7 Tage',zahl(f.tage_7),'werden nach 30 Tagen gelöscht',f.tage_7>20)
    +'</div>';
  h+='<div class="card"><div class="ct">Fehler pro Tag (14 Tage)</div>'+diagramm(f.pro_tag,[{key:'anzahl',name:'Fehler'}])+'</div>';
  h+='<div class="card"><div class="ct">Häufigste Fehler (7 Tage)</div><table><tr><th>Meldung</th><th>Seite</th><th class="n">Anzahl</th><th>Zuletzt</th></tr>'
    +(f.haeufigste.length?f.haeufigste.map(function(e){return '<tr><td class="m">'+esc(e.meldung)+'</td><td class="m muted">'+esc(e.seite)+'</td><td class="n">'+zahl(e.anzahl)+'</td><td class="muted">'+datum(e.zuletzt,true)+'</td></tr>';}).join(''):'<tr><td colspan="4" class="muted">Keine Fehler 🎉</td></tr>')
    +'</table></div>';
  h+='<div class="card"><div class="ct">Neueste Fehler</div><table><tr><th>Zeit</th><th>Meldung</th><th>Seite / Stelle</th><th>Browser</th></tr>'
    +(f.neueste.length?f.neueste.map(function(e){return '<tr><td class="muted">'+datum(e.created_at,true)+'</td><td class="m">'+esc(e.meldung)+'</td><td class="m muted">'+esc(e.seite)+'<br>'+esc(e.quelle)+'</td><td class="m muted">'+esc(browserKurz(e.browser))+'</td></tr>';}).join(''):'<tr><td colspan="4" class="muted">Keine Fehler</td></tr>')
    +'</table></div>';

  h+='<h2>Neueste Nutzer</h2><div class="card"><table><tr><th>E-Mail</th><th>Registriert</th><th>Zuletzt angemeldet</th><th class="n">Reisen</th><th class="n">KI-Aufrufe</th></tr>'
    +n.liste.map(function(u){return '<tr><td>'+esc(u.email)+'</td><td class="muted">'+datum(u.erstellt)+'</td><td class="muted">'+datum(u.zuletzt,true)+'</td><td class="n">'+zahl(u.reisen)+'</td><td class="n">'+zahl(u.ki)+'</td></tr>';}).join('')
    +'</table></div>';

  h+='<div class="sub" style="margin-top:28px">Alle Seitenaufrufe (Startseite, Länder, Herkunft, Geräte) siehst du in <a href="https://vercel.com/tripstoryaicom/tripstoryai.com/analytics" target="_blank" rel="noopener" style="color:var(--terra)">Vercel Web Analytics</a>.</div>';
  app.innerHTML=h;
}
function browserKurz(ua){
  ua=ua||'';var os=/iPhone|iPad/.test(ua)?'iOS':/Android/.test(ua)?'Android':/Mac OS/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'';
  var br=/Edg\//.test(ua)?'Edge':/CriOS|Chrome\//.test(ua)?'Chrome':/FxiOS|Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'';
  return (br+' '+os).trim()||ua.slice(0,40);
}

async function laden(){
  var ses=await sb.auth.getSession();
  if(!ses.data||!ses.data.session){
    meldung('Bitte anmelden','Die Admin-Übersicht ist nur mit deinem Konto erreichbar.','<a class="btn" href="/meine-reisen.html">Zur Anmeldung</a>');
    return;
  }
  var res=await sb.rpc('admin_uebersicht');
  if(res.error){
    if(/kein zugriff/i.test(res.error.message||''))meldung('Kein Zugriff','Diese Seite ist nur für die Betreiberin von Travona.','<a class="btn" href="/">Zur Startseite</a>');
    else meldung('Laden fehlgeschlagen',res.error.message||'Unbekannter Fehler','<button class="btn" onclick="laden()">Nochmal versuchen</button>');
    return;
  }
  document.getElementById('reload').hidden=false;
  zeigen(res.data);
}

// Tooltip für Diagramme
var tip=document.getElementById('tip');
document.addEventListener('mousemove',function(e){
  var b=e.target.closest&&e.target.closest('[data-tip]');
  if(!b){tip.style.display='none';return;}
  tip.textContent=b.getAttribute('data-tip');tip.style.display='block';
  tip.style.left=Math.min(e.clientX+12,innerWidth-160)+'px';tip.style.top=(e.clientY-30)+'px';
});
laden();
</script>
</body>
</html>
